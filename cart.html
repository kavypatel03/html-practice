<!DOCTYPE html>
<html>
<head>
    <title>Cart | Amazon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <a href="index.html" class="logo">Amazon</a>
    </div>

    <div class="navbar">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="cart.html">Cart</a>
    </div>

    <div class="container">
        <h1>Your Shopping Cart</h1>
        
        <div>
            <h2>Items in Cart</h2>
            <div class="product">
                <h3>Product 1</h3>
                <img src="https://m.media-amazon.com/images/I/611eheaZdyL._AC_SL1500_.jpg" alt="Product 1">
                <p class="price">₹800.00</p>
                <p>Quantity: 1</p>
            </div>
            <p><strong>Total: ₹800.00</strong></p>
        </div>

        <div>
            <h2>Shipping Details</h2>
            <form>
                <div class="form-group">
                    <label>Full Name:</label>
                    <input type="text" name="name">
                </div>
                <div class="form-group">
                    <label>Address:</label>
                    <input type="text" name="address">
                </div>
                <div class="form-group">
                    <label>City:</label>
                    <input type="text" name="city">
                </div>
                <div class="form-group">
                    <label>Zip Code:</label>
                    <input type="text" name="zip">
                </div>
            </form>
        </div>

        <div>
            <h2>Payment Details</h2>
            <form>
                <div class="form-group">
                    <label>Card Number:</label>
                    <input type="text" name="card">
                </div>
                <div class="form-group">
                    <label>Expiration Date:</label>
                    <input type="text" name="exp">
                </div>
                <div class="form-group">
                    <label>CVV:</label>
                    <input type="text" name="cvv">
                </div>
                <br>
                <button type="button">Place Order</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 Amazon</p>
    </div>

</body>
</html>
